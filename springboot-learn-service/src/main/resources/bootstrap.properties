# 是否启用nacos支持
flink.nacos.enable=true
# nacos地址
flink.nacos.serverAddr=58.87.74.91:8848
# nacos命名空间
flink.nacos.namespace=public
# nacos配置分组
flink.nacos.groups=DEFAULT_GROUP
