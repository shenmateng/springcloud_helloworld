# 是否开启nacos支持
flink.nacos.enable=true
# nacos地址 测试[] 线上单机[] 线上集群[]
flink.nacos.serverAddr=127.0.0.1:8848
# nacos命名空间 测试[test] 线上单机[single] 线上集群[cluster]
flink.nacos.namespace=single
# nacos配置分组
flink.nacos.groups=DEFAULT_GROUP
# nacos的data-id 测试[stream-test] 线上单机[stream-single] 线上集群[stream-cluster]
flink.nacos.dataIds=stream-single.properties
